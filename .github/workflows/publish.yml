name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - name: Guard against secrets in the sdist
        run: |
          if tar tzf dist/*.tar.gz | grep -Ei 'tokens?\.json|\.db($|\.)|\.env$'; then
            echo "::error::secret-shaped file in sdist"; exit 1
          fi
      - run: twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1

      # Register the server in the official MCP registry (metadata only).
      - name: Sync server.json version to the release tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '.version=$v | .packages[0].version=$v' server.json > server.tmp && mv server.tmp server.json
      - name: Publish to the MCP registry
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          # PyPI's description (carrying the mcp-name token) can lag a few seconds after upload; retry.
          for i in 1 2 3 4 5; do
            if ./mcp-publisher publish; then exit 0; fi
            echo "mcp-publisher publish attempt $i failed; retrying in 15s"; sleep 15
          done
          echo "::error::mcp-publisher publish failed after retries"; exit 1
