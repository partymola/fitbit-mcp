name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - name: Guard against secrets in the sdist
        run: |
          if tar tzf dist/*.tar.gz | grep -Ei 'tokens?\.json|\.db($|\.)|\.env$'; then
            echo "::error::secret-shaped file in sdist"; exit 1
          fi
      - run: twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
